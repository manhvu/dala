name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: elixir-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: "Format / Credo / Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.19"
            otp: "28"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Run tests
        run: mix test

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Cache deps + PLT
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: plt-1.18-27-${{ hashFiles('mix.lock') }}

      - name: Dialyzer
        run: |
          mix deps.get
          mkdir -p priv/plts
          mix dialyzer --plt priv/plts/dala.plt --no-check
